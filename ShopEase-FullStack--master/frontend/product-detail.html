<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details - ShopEase</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="navbar-root"></div>

<div class="container py-4">
  <div class="row g-4" id="productDetailRoot">
    <div class="col-12 text-center text-muted-se py-5">Loading product...</div>
  </div>

  <hr class="my-5">

  <div class="row">
    <div class="col-lg-8">
      <h4 class="mb-3">Customer Reviews</h4>

      <div id="reviewFormWrap" class="se-summary-card mb-4 d-none">
        <h6>Write a Review</h6>
        <form onsubmit="return submitReviewForm(event)">
          <div class="mb-2">
            <select class="form-select form-select-sm" style="max-width:160px;" id="reviewRatingInput">
              <option value="5">5 Stars</option>
              <option value="4">4 Stars</option>
              <option value="3">3 Stars</option>
              <option value="2">2 Stars</option>
              <option value="1">1 Star</option>
            </select>
          </div>
          <div class="mb-2">
            <textarea class="form-control form-control-sm" id="reviewCommentInput" rows="2" placeholder="Share your thoughts about this product..."></textarea>
          </div>
          <button type="submit" class="btn btn-se-primary btn-sm">Submit Review</button>
        </form>
      </div>

      <div id="reviewsList">Loading reviews...</div>
    </div>
  </div>
</div>

<div id="footer-root"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/navbar.js"></script>
<script src="js/product.js"></script>
<script>
  (async function () {
    await initPage('');
    loadProductDetail();
  })();
</script>
</body>
</html>
