<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Form - ShopEase Admin</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div id="navbar-root"></div>
<div class="container-fluid">
  <div class="row">
    <div class="col-md-2 px-0" id="adminSidebar"></div>
    <div class="col-md-10 py-4">
      <a href="admin-products.html" class="small d-inline-block mb-3"><i class="bi bi-arrow-left me-1"></i>Back to Products</a>
      <h3 class="mb-4" id="productFormTitle">Add Product</h3>

      <div class="row g-4">
        <div class="col-lg-8">
          <form class="se-summary-card" onsubmit="return saveProductForm(event)">
            <input type="hidden" id="productId">
            <div class="mb-3">
              <label class="form-label">Product Name</label>
              <input type="text" class="form-control" id="pfName" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea class="form-control" id="pfDescription" rows="3"></textarea>
            </div>
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label">Category</label>
                <select class="form-select" id="pfCategory" required></select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Brand</label>
                <input type="text" class="form-control" id="pfBrand">
              </div>
            </div>
            <div class="row g-3 mb-3">
              <div class="col-md-4">
                <label class="form-label">Price (₹)</label>
                <input type="number" step="0.01" min="0.01" class="form-control" id="pfPrice" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Discount Price (₹)</label>
                <input type="number" step="0.01" min="0" class="form-control" id="pfDiscountPrice" placeholder="Optional">
              </div>
              <div class="col-md-4">
                <label class="form-label">Stock Quantity</label>
                <input type="number" min="0" class="form-control" id="pfStock" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Product Image URL (public, online)</label>
              <input type="url" class="form-control" id="pfImageUrl" required placeholder="https://images.unsplash.com/..." oninput="previewProductImage()">
              <div class="form-text">Must be a valid, publicly accessible image URL. This exact URL will be shown everywhere this product appears.</div>
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="pfTrending">
              <label class="form-check-label" for="pfTrending">Mark as Trending</label>
            </div>
            <button type="submit" class="btn btn-se-primary">Save Product</button>
          </form>
        </div>
        <div class="col-lg-4">
          <div class="se-summary-card">
            <h6 class="mb-2">Image Preview</h6>
            <img id="pfImagePreview" src="" class="d-none" style="width:100%;border-radius:10px;" onerror="this.src=FALLBACK_IMAGE;">
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/navbar.js"></script>
<script src="../js/admin.js"></script>
<script>
  (async function () {
    if (!(await initAdminPage('products'))) return;
    loadProductForm();
  })();
</script>
</body>
</html>
