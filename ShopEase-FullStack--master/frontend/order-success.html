<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Placed - ShopEase</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="navbar-root"></div>

<div class="container py-5 text-center" style="max-width:520px;">
  <div class="se-auth-card">
    <i class="bi bi-check-circle-fill" style="font-size:3.5rem;color:var(--se-success);"></i>
    <h3 class="mt-3">Order Placed Successfully!</h3>
    <p class="text-muted-se" id="orderSuccessMsg">Thank you for shopping with ShopEase.</p>
    <div class="d-flex gap-2 justify-content-center mt-4">
      <a href="#" id="viewOrderLink" class="btn btn-se-primary">View Order</a>
      <a href="products.html" class="btn btn-se-outline">Continue Shopping</a>
    </div>
  </div>
</div>

<div id="footer-root"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/navbar.js"></script>
<script>
  (async function () {
    await initPage('');
    const orderId = new URLSearchParams(window.location.search).get('orderId');
    if (orderId) {
      document.getElementById('orderSuccessMsg').textContent = 'Your order #' + orderId + ' has been placed and is being processed.';
      document.getElementById('viewOrderLink').href = 'order-details.html?id=' + orderId;
    }
    refreshNavBadges();
  })();
</script>
</body>
</html>
