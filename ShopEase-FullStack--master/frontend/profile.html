<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile - ShopEase</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="navbar-root"></div>

<div class="container py-4">
  <h3 class="mb-4">My Profile</h3>
  <div class="row g-4">
    <div class="col-lg-5">
      <div class="se-auth-card">
        <h5 class="mb-3">Account Details</h5>
        <form onsubmit="return handleProfileUpdate(event)">
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" id="profileFullName" required minlength="2">
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="profileEmail" disabled>
            <div class="form-text">Email cannot be changed.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="tel" class="form-control" id="profilePhone" pattern="[0-9]{10}" placeholder="10 digit number">
          </div>
          <button type="submit" class="btn btn-se-primary" id="profileSaveBtn">Save Changes</button>
        </form>
      </div>
    </div>

    <div class="col-lg-7">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">Saved Addresses</h5>
        <button class="btn btn-se-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addressModal" onclick="openAddressModal()">
          <i class="bi bi-plus-lg me-1"></i>Add Address
        </button>
      </div>
      <div id="addressesList"><div class="text-muted-se">Loading addresses...</div></div>
    </div>
  </div>
</div>

<!-- Address Add/Edit Modal -->
<div class="modal fade" id="addressModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addressModalTitle">Add Address</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="addressForm" onsubmit="return saveAddress(event)">
          <input type="hidden" id="addressId">
          <div class="mb-2"><label class="form-label small">Full Name</label><input type="text" class="form-control" id="addrFullName" required></div>
          <div class="mb-2"><label class="form-label small">Phone Number</label><input type="tel" class="form-control" id="addrPhone" pattern="[0-9]{10}" required></div>
          <div class="mb-2"><label class="form-label small">Address</label><textarea class="form-control" id="addrAddress" required></textarea></div>
          <div class="row g-2 mb-2">
            <div class="col-6"><label class="form-label small">City</label><input type="text" class="form-control" id="addrCity" required></div>
            <div class="col-6"><label class="form-label small">State</label><input type="text" class="form-control" id="addrState" required></div>
          </div>
          <div class="mb-2"><label class="form-label small">Pincode</label><input type="text" class="form-control" id="addrPincode" required></div>
          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" id="addrIsDefault">
            <label class="form-check-label small" for="addrIsDefault">Set as default address</label>
          </div>
          <button type="submit" class="btn btn-se-primary w-100">Save Address</button>
        </form>
      </div>
    </div>
  </div>
</div>

<div id="footer-root"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/navbar.js"></script>
<script src="js/profile.js"></script>
<script>
  (async function () {
    await initPage('');
    if (!requireLogin('profile.html')) return;
    loadProfile();
    loadAddresses();
  })();
</script>
</body>
</html>
