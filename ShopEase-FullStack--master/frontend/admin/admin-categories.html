<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Categories - ShopEase Admin</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div id="navbar-root"></div>
<div class="container-fluid">
  <div class="row">
    <div class="col-md-2 px-0" id="adminSidebar"></div>
    <div class="col-md-10 py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="mb-0">Manage Categories</h3>
        <button class="btn btn-se-primary btn-sm" data-bs-toggle="modal" data-bs-target="#categoryModal" onclick="openCategoryModal()">
          <i class="bi bi-plus-lg me-1"></i>Add Category
        </button>
      </div>
      <div class="table-responsive">
        <table class="table se-table align-middle">
          <thead><tr><th>Image</th><th>Name</th><th>Parent Category</th><th>Actions</th></tr></thead>
          <tbody id="adminCategoriesBody">
            <tr><td colspan="4" class="text-center text-muted-se py-4">Loading categories...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="categoryModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="categoryModalTitle">Add Category</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="categoryForm" onsubmit="return saveCategoryForm(event)">
          <input type="hidden" id="categoryId">
          <div class="mb-2"><label class="form-label small">Category Name</label><input type="text" class="form-control" id="catName" required></div>
          <div class="mb-2"><label class="form-label small">Image URL (public, online)</label><input type="url" class="form-control" id="catImageUrl" required></div>
          <div class="mb-2">
            <label class="form-label small">Parent Category (optional)</label>
            <select class="form-select" id="catParentId"><option value="">— None (Top Level) —</option></select>
          </div>
          <button type="submit" class="btn btn-se-primary w-100">Save Category</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/navbar.js"></script>
<script src="../js/admin.js"></script>
<script>
  (async function () {
    if (!(await initAdminPage('categories'))) return;
    loadAdminCategories();
  })();
</script>
</body>
</html>
