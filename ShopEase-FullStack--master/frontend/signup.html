<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - ShopEase</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="navbar-root"></div>

<div class="container py-5" style="max-width:480px;">
  <div class="se-auth-card">
    <h3 class="mb-1">Create your account</h3>
    <p class="text-muted-se mb-4">Join ShopEase to track orders, save addresses, and more.</p>

    <form id="signupForm" novalidate onsubmit="return handleSignup(event)">
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control" id="signupName" required minlength="2">
        <div class="invalid-feedback">Please enter your full name (min 2 characters).</div>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="signupEmail" required>
        <div class="invalid-feedback">Please enter a valid email address.</div>
      </div>
      <div class="mb-3">
        <label class="form-label">Phone Number</label>
        <input type="tel" class="form-control" id="signupPhone" pattern="[0-9]{10}" placeholder="10 digit number">
        <div class="invalid-feedback">Phone number must be exactly 10 digits.</div>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="signupPassword" required minlength="6">
        <div class="invalid-feedback">Password must be at least 6 characters.</div>
      </div>
      <button type="submit" class="btn btn-se-primary w-100" id="signupSubmitBtn">Create Account</button>
    </form>
    <p class="text-center small mt-4 mb-0">Already have an account? <a href="login.html">Login</a></p>
  </div>
</div>

<div id="footer-root"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/navbar.js"></script>
<script src="js/auth.js"></script>
<script>
  (async function () { await initPage(''); if (isLoggedIn()) window.location.href = 'index.html'; })();
</script>
</body>
</html>
