<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Products - ShopEase</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="navbar-root"></div>

<div class="container py-4">
  <div class="row g-4">
    <!-- Filters -->
    <div class="col-lg-3">
      <form id="filtersForm" class="se-summary-card" onsubmit="return applyFilters(event)">
        <h5 class="mb-3">Filters</h5>
        <div class="mb-3">
          <label class="form-label small">Search</label>
          <input type="text" class="form-control form-control-sm" id="filterKeyword" placeholder="Product, brand, category...">
        </div>
        <div class="mb-3">
          <label class="form-label small">Category</label>
          <select class="form-select form-select-sm" id="filterCategory"><option value="">All Categories</option></select>
        </div>
        <div class="mb-3">
          <label class="form-label small">Brand</label>
          <input type="text" class="form-control form-control-sm" id="filterBrand" placeholder="e.g. SoundCore">
        </div>
        <div class="mb-3">
          <label class="form-label small">Price Range</label>
          <div class="d-flex gap-2">
            <input type="number" min="0" class="form-control form-control-sm" id="filterMinPrice" placeholder="Min">
            <input type="number" min="0" class="form-control form-control-sm" id="filterMaxPrice" placeholder="Max">
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label small">Minimum Rating</label>
          <select class="form-select form-select-sm" id="filterMinRating">
            <option value="">Any Rating</option>
            <option value="4">4★ & above</option>
            <option value="3">3★ & above</option>
            <option value="2">2★ & above</option>
            <option value="1">1★ & above</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label small">Sort By</label>
          <select class="form-select form-select-sm" id="filterSortBy">
            <option value="">Relevance</option>
            <option value="price_asc">Price: Low to High</option>
            <option value="price_desc">Price: High to Low</option>
            <option value="rating">Rating</option>
            <option value="newest">Newest First</option>
          </select>
        </div>
        <button type="submit" class="btn btn-se-primary btn-sm w-100 mb-2">Apply Filters</button>
        <button type="button" class="btn btn-outline-secondary btn-sm w-100" onclick="resetFilters()">Reset</button>
      </form>
    </div>

    <!-- Results -->
    <div class="col-lg-9">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">All Products</h4>
        <span class="small text-muted-se" id="resultsCount"></span>
      </div>
      <div class="row g-3" id="productsGrid">
        <div class="col-12 text-center text-muted-se py-5">Loading products...</div>
      </div>
    </div>
  </div>
</div>

<div id="footer-root"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/navbar.js"></script>
<script src="js/product.js"></script>
<script>
  (async function () {
    await initPage('');
    loadProductsPage();
  })();
</script>
</body>
</html>
