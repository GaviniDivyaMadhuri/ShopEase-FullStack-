# ============================================
# ShopEase - Application Configuration
# ============================================

# Application name
spring.application.name=ShopEase

# ============================================
# Server Configuration
# ============================================

server.port=8080

# ============================================
# MySQL Database Configuration
# ============================================

# MySQL database
spring.datasource.url=jdbc:mysql://localhost:3306/shopease_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# MySQL username
spring.datasource.username=root

# MySQL password
spring.datasource.password=test

# MySQL driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / Hibernate Configuration
# ============================================

# Automatically create/update database tables
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console
spring.jpa.show-sql=true

# Format SQL queries
spring.jpa.properties.hibernate.format_sql=true

# Hibernate dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable Open Session in View
spring.jpa.open-in-view=false

# ============================================
# Session Configuration
# ============================================

# Session timeout - 30 minutes
server.servlet.session.timeout=30m

# ============================================
# CORS - Frontend Origins
# ============================================

app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173,http://localhost:3000

# ============================================
# Logging
# ============================================

# Spring Security logging
logging.level.org.springframework.security=INFO

# ShopEase application logging
logging.level.com.shopease=DEBUG