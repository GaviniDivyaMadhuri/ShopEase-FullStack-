<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - ShopEase</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="navbar-root"></div>

<div class="container py-4">
  <h3 class="mb-4">Checkout</h3>
  <div class="row g-4">
    <div class="col-lg-7">
      <div class="se-summary-card mb-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="mb-0">Shipping Address</h5>
          <button class="btn btn-se-outline btn-sm" onclick="openCheckoutAddressForm()">+ Add New</button>
        </div>
        <div id="checkoutAddressList"><div class="text-muted-se">Loading addresses...</div></div>

        <form id="checkoutAddressForm" class="d-none mt-3 border-top pt-3" onsubmit="return saveCheckoutAddress(event)">
          <div class="mb-2"><label class="form-label small">Full Name</label><input type="text" class="form-control" id="coFullName" required></div>
          <div class="mb-2"><label class="form-label small">Phone Number</label><input type="tel" class="form-control" id="coPhone" pattern="[0-9]{10}" required></div>
          <div class="mb-2"><label class="form-label small">Address</label><textarea class="form-control" id="coAddress" required></textarea></div>
          <div class="row g-2 mb-2">
            <div class="col-6"><label class="form-label small">City</label><input type="text" class="form-control" id="coCity" required></div>
            <div class="col-6"><label class="form-label small">State</label><input type="text" class="form-control" id="coState" required></div>
          </div>
          <div class="mb-2"><label class="form-label small">Pincode</label><input type="text" class="form-control" id="coPincode" required></div>
          <button type="submit" class="btn btn-se-primary btn-sm">Save Address</button>
          <button type="button" class="btn btn-outline-secondary btn-sm" onclick="document.getElementById('checkoutAddressForm').classList.add('d-none')">Cancel</button>
        </form>
      </div>

      <div class="se-summary-card mb-4">
        <h5 class="mb-3">Payment Method</h5>
        <div class="form-check mb-2">
          <input class="form-check-input" type="radio" name="paymentMode" id="payCOD" value="COD" checked>
          <label class="form-check-label" for="payCOD">Cash on Delivery</label>
        </div>
        <div class="form-check mb-2">
          <input class="form-check-input" type="radio" name="paymentMode" id="payCARD" value="CARD">
          <label class="form-check-label" for="payCARD">Card Payment (Demo)</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="paymentMode" id="payUPI" value="UPI">
          <label class="form-check-label" for="payUPI">UPI (Demo)</label>
        </div>
        <p class="small text-muted-se mt-2 mb-0"><i class="bi bi-info-circle me-1"></i>This is a simulated payment for demo purposes - no real transaction occurs.</p>
      </div>

      <div class="se-summary-card">
        <h5 class="mb-3">Order Items</h5>
        <div id="checkoutItemsList"><div class="text-muted-se">Loading items...</div></div>
      </div>
    </div>

    <div class="col-lg-5">
      <div class="se-summary-card">
        <h5 class="mb-3">Price Details</h5>
        <div class="se-summary-row"><span>Subtotal</span><span id="coSubtotal">₹0.00</span></div>
        <div class="se-summary-row"><span>Delivery Charge</span><span id="coDelivery">₹0.00</span></div>
        <div class="se-summary-total"><span>Total Amount</span><span id="coTotal">₹0.00</span></div>
        <button class="btn btn-se-accent w-100 mt-3" id="placeOrderBtn" onclick="placeOrder()">Place Order</button>
      </div>
    </div>
  </div>
</div>

<div id="footer-root"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/navbar.js"></script>
<script src="js/checkout.js"></script>
<script>
  (async function () {
    await initPage('');
    if (!requireLogin('checkout.html')) return;
    loadCheckout();
  })();
</script>
</body>
</html>
