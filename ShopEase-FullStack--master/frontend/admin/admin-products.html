<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Products - ShopEase Admin</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div id="navbar-root"></div>
<div class="container-fluid">
  <div class="row">
    <div class="col-md-2 px-0" id="adminSidebar"></div>
    <div class="col-md-10 py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="mb-0">Manage Products</h3>
        <a href="admin-product-form.html" class="btn btn-se-primary btn-sm"><i class="bi bi-plus-lg me-1"></i>Add Product</a>
      </div>
      <div class="table-responsive">
        <table class="table se-table align-middle">
          <thead><tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Trending</th><th>Actions</th></tr></thead>
          <tbody id="adminProductsBody">
            <tr><td colspan="7" class="text-center text-muted-se py-4">Loading products...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/navbar.js"></script>
<script src="../js/admin.js"></script>
<script>
  (async function () {
    if (!(await initAdminPage('products'))) return;
    loadAdminProducts();
  })();
</script>
</body>
</html>
