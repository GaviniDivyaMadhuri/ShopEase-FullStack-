<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cart - ShopEase</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="navbar-root"></div>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">My Cart</h3>
    <button class="btn btn-se-ghost-danger btn-sm" id="clearCartBtn" onclick="clearCartHandler()">Clear Cart</button>
  </div>

  <div class="row g-4">
    <div class="col-lg-8">
      <div id="cartItemsList">
        <div class="text-center text-muted-se py-5">Loading cart...</div>
      </div>
    </div>
    <div class="col-lg-4">
      <div class="se-summary-card">
        <h5 class="mb-3">Order Summary</h5>
        <div class="se-summary-row"><span>Subtotal</span><span id="summarySubtotal">₹0.00</span></div>
        <div class="se-summary-row"><span>Delivery Charge</span><span id="summaryDelivery">₹0.00</span></div>
        <div class="se-summary-total"><span>Total</span><span id="summaryTotal">₹0.00</span></div>
        <button class="btn btn-se-primary w-100 mt-3" id="checkoutBtn" onclick="window.location.href='checkout.html'">Proceed to Checkout</button>
        <a href="products.html" class="btn btn-se-outline w-100 mt-2">Continue Shopping</a>
      </div>
    </div>
  </div>
</div>

<div id="footer-root"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/navbar.js"></script>
<script src="js/cart.js"></script>
<script>
  (async function () {
    await initPage('');
    if (!requireLogin('cart.html')) return;
    loadCart();
  })();
</script>
</body>
</html>
