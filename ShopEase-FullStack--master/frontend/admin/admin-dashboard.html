<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - ShopEase</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div id="navbar-root"></div>
<div class="container-fluid">
  <div class="row">
    <div class="col-md-2 px-0" id="adminSidebar"></div>
    <div class="col-md-10 py-4">
      <h3 class="mb-4">Dashboard</h3>
      <div class="row g-3">
        <div class="col-6 col-lg-4">
          <div class="se-stat-card"><div class="small text-muted-se mb-1">Total Users</div><div class="value" id="statUsers">—</div></div>
        </div>
        <div class="col-6 col-lg-4">
          <div class="se-stat-card"><div class="small text-muted-se mb-1">Total Products</div><div class="value" id="statProducts">—</div></div>
        </div>
        <div class="col-6 col-lg-4">
          <div class="se-stat-card"><div class="small text-muted-se mb-1">Total Categories</div><div class="value" id="statCategories">—</div></div>
        </div>
        <div class="col-6 col-lg-4">
          <div class="se-stat-card"><div class="small text-muted-se mb-1">Total Orders</div><div class="value" id="statOrders">—</div></div>
        </div>
        <div class="col-6 col-lg-4">
          <div class="se-stat-card"><div class="small text-muted-se mb-1">Total Revenue</div><div class="value" id="statRevenue">—</div></div>
        </div>
        <div class="col-6 col-lg-4">
          <div class="se-stat-card"><div class="small text-muted-se mb-1">Pending Orders</div><div class="value" id="statPending">—</div></div>
        </div>
      </div>

      <div class="row g-3 mt-2">
        <div class="col-md-4">
          <a href="admin-products.html" class="se-product-card p-3 d-block text-decoration-none">
            <i class="bi bi-box-seam fs-3 text-primary"></i>
            <h6 class="mt-2 mb-0">Manage Products</h6>
          </a>
        </div>
        <div class="col-md-4">
          <a href="admin-orders.html" class="se-product-card p-3 d-block text-decoration-none">
            <i class="bi bi-receipt fs-3 text-primary"></i>
            <h6 class="mt-2 mb-0">Manage Orders</h6>
          </a>
        </div>
        <div class="col-md-4">
          <a href="admin-users.html" class="se-product-card p-3 d-block text-decoration-none">
            <i class="bi bi-people fs-3 text-primary"></i>
            <h6 class="mt-2 mb-0">Manage Users</h6>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/navbar.js"></script>
<script src="../js/admin.js"></script>
<script>
  (async function () {
    if (!(await initAdminPage('dashboard'))) return;
    loadAdminDashboard();
  })();
</script>
</body>
</html>
